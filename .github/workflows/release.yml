name: Publish AsterOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 32-bit toolchain and release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Run tests and build release artifacts
        run: |
          make check CC='gcc -m32' LD='ld -m elf_i386' AS='as' SIZE='size'
          make iso CC='gcc -m32' LD='ld -m elf_i386' AS='as' SIZE='size'
          sha256sum build/kernel.bin build/hello.com build/ai-os.iso > build/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            AsterOS 32-bit x86 weekly release.

            Validation:
            - `make check CC='gcc -m32' LD='ld -m elf_i386' AS='as' SIZE='size'`
            - `make iso CC='gcc -m32' LD='ld -m elf_i386' AS='as' SIZE='size'`
          files: |
            build/kernel.bin
            build/hello.com
            build/ai-os.iso
            build/SHA256SUMS
