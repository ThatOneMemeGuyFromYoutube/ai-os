name: Publish AsterOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET: i686-linux-gnu
  CC: i686-linux-gnu-gcc
  LD: i686-linux-gnu-ld
  AS: i686-linux-gnu-as
  SIZE: i686-linux-gnu-size

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install 32-bit toolchain and release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Run tests and build release artifacts
        run: |
          make check
          make iso
          make check-iso QEMU=qemu-system-i386
          sha256sum build/kernel.bin build/hello.com build/ai-os.iso > build/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            AsterOS 32-bit x86 weekly release.

            Validation:
            - `make check`
            - `make iso`
          files: |
            build/kernel.bin
            build/hello.com
            build/ai-os.iso
            build/SHA256SUMS
