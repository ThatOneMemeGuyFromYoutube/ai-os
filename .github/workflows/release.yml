name: Publish AsterOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET: i686-linux-gnu
  CC: i686-linux-gnu-gcc
  LD: i686-linux-gnu-ld
  AS: i686-linux-gnu-as
  SIZE: i686-linux-gnu-size

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install 32-bit toolchain and release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Run tests and build release artifacts
        run: |
          make check
          make iso
          make check-iso QEMU=qemu-system-i386
          make check-start-menu-iso QEMU=qemu-system-i386 QEMU_TIMEOUT=12
          make check-ne2k-iso QEMU=qemu-system-i386
          make check-ne2k-peer-iso QEMU=qemu-system-i386
          make check-ata-iso QEMU=qemu-system-i386
          make check-volume-iso QEMU=qemu-system-i386
          make check-asterbios-iso QEMU=qemu-system-i386
          sha256sum build/kernel.bin build/hello.com build/ai-os.iso build/firmware/asterbios.bin build/firmware/asterbios-source-rel-1.17.0.tar.gz build/firmware/asterbios-build.patch > build/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            AsterOS 32-bit x86 weekly release.

            Desktop update:
            - The VGA text-mode desktop now has a Start menu opened by clicking Start or pressing Ctrl+Esc, with keyboard/mouse navigation and shortcuts for the built-in applications.
            - The Run dialog resolves only known built-in application names/aliases and rejects unknown commands; arbitrary transient program execution is not claimed.

            Validation:
            - `make check` (including IPv4/ICMP, keyboard, desktop-input, and GUI host regressions)
            - `make iso`
            - `make check-iso QEMU=qemu-system-i386`
            - `make check-start-menu-iso QEMU=qemu-system-i386 QEMU_TIMEOUT=12` (Terminal `help files`/`help ide`, `apps` inventory, Ctrl+Esc, Run rejection/cancellation, Files launch, and Tab switching in the actual guest)
            - `make check-ne2k-iso QEMU=qemu-system-i386`
            - `make check-ne2k-peer-iso QEMU=qemu-system-i386` (guest ARP resolution and IPv4 ICMP echo request/reply through a deterministic QEMU socket peer)
            - `make check-ata-iso QEMU=qemu-system-i386`
            - `make check-volume-iso QEMU=qemu-system-i386` (read-only discovery of an explicitly tagged AsterOS partition)
            - `make check-asterbios-iso QEMU=qemu-system-i386` (optional AsterBIOS ROM; SeaBIOS remains default)
            - AsterBIOS ROM, exact corresponding SeaBIOS source archive, build metadata, and upstream license texts are included as optional firmware artifacts.
          files: |
            build/kernel.bin
            build/hello.com
            build/ai-os.iso
            build/firmware/asterbios.bin
            build/firmware/asterbios-source-rel-1.17.0.tar.gz
            build/firmware/asterbios-build-info.txt
            build/firmware/asterbios-build.patch
            build/firmware/SeaBIOS-COPYING
            build/firmware/SeaBIOS-COPYING.LESSER
            build/SHA256SUMS
