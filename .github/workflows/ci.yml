name: Build and test AsterOS

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 32-bit toolchain and GRUB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Run TinyLang tests and build program image
        run: make check CC='gcc -m32' LD='ld -m elf_i386'

      - name: Build kernel
        run: make all CC='gcc -m32' LD='ld -m elf_i386'

      - name: Build bootable ISO
        run: make iso CC='gcc -m32' LD='ld -m elf_i386'
