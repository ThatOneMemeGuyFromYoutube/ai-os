name: Build and test AsterOS

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET: i686-linux-gnu
  CC: i686-linux-gnu-gcc
  LD: i686-linux-gnu-ld
  AS: i686-linux-gnu-as
  OBJCOPY: i686-linux-gnu-objcopy
  SIZE: i686-linux-gnu-size

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install 32-bit cross compiler and GRUB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Verify cross compiler
        run: |
          command -v "$CC"
          "$CC" -dumpmachine
          "$LD" -V 2>&1 | grep -q 'elf_i386'

      - name: Run TinyLang tests and build program image
        run: make check

      - name: Build kernel
        run: make all

      - name: Build bootable ISO
        run: make iso

      - name: Boot-test ISO
        run: make QEMU=qemu-system-i386 QEMU_TIMEOUT=8 check-iso

      - name: Exercise Start menu, Run dialog, and taskbar switching in QEMU
        run: make QEMU=qemu-system-i386 QEMU_TIMEOUT=12 check-start-menu-iso

      - name: Boot-test ISO with emulated RTL8029 NE2K
        run: make QEMU=qemu-system-i386 QEMU_TIMEOUT=8 check-ne2k-iso

      - name: Exchange ARP and IPv4 ICMP echo frames with a deterministic NE2K peer
        run: make QEMU=qemu-system-i386 NE2K_PEER_TIMEOUT=20 check-ne2k-peer-iso

      - name: Boot-test ISO with disposable ATA disk
        run: make QEMU=qemu-system-i386 QEMU_TIMEOUT=8 check-ata-iso

      - name: Boot-test ISO with an explicitly tagged AsterOS volume
        run: make QEMU=qemu-system-i386 QEMU_TIMEOUT=8 check-volume-iso

      - name: Boot-test ISO with AsterBIOS
        run: make QEMU=qemu-system-i386 QEMU_TIMEOUT=8 check-asterbios-iso
