name: Build and test AsterOS

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install 32-bit cross compiler and GRUB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Run TinyLang tests and build program image
        run: make TARGET=i686-linux-gnu check

      - name: Build kernel
        run: make TARGET=i686-linux-gnu all

      - name: Build bootable ISO
        run: make TARGET=i686-linux-gnu iso

      - name: Boot-test ISO
        run: make TARGET=i686-linux-gnu QEMU=qemu-system-i386 QEMU_TIMEOUT=8 check-iso
