name: Build AI-OS

on:
  push:
    branches: ["main", "feature/lightweight-gui-shell"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu qemu-system-x86

      - name: Validate TinyLang and build kernel
        run: |
          make TARGET=i686-linux-gnu check
          make TARGET=i686-linux-gnu
          file build/kernel.bin

      - name: Package binary
        run: |
          tar -C build -czf ai-os-${GITHUB_SHA}.tar.gz kernel.bin hello.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-os-${{ github.sha }}
          path: ai-os-${{ github.sha }}.tar.gz

      - name: Publish validated main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(git tag --list 'v0.1.*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="v0.1.0"
          else
            patch="${latest##*.}"
            version="v0.1.$((patch + 1))"
          fi
          gh release create "$version" "ai-os-${GITHUB_SHA}.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "AI-OS $version" \
            --generate-notes

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ai-os-${{ github.sha }}.tar.gz
