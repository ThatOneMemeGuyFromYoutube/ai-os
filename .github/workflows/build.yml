name: Build AI-OS

on:
  push:
    branches: ["main", "feature/lightweight-gui-shell"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu qemu-system-x86

      - name: Build kernel
        run: |
          make TARGET=i686-linux-gnu
          file build/kernel.bin

      - name: Package binary
        run: |
          tar -C build -czf ai-os-${GITHUB_REF_NAME}.tar.gz kernel.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-os-${{ github.sha }}
          path: ai-os-${{ github.ref_name }}.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ai-os-${{ github.ref_name }}.tar.gz
