name: Build AI-OS

on:
  push:
    branches: ["main", "feature/lightweight-gui-shell"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cross compiler, GRUB, ISO tools, and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Validate TinyLang and build kernel
        run: |
          make TARGET=i686-linux-gnu check
          make TARGET=i686-linux-gnu
          file build/kernel.bin

      - name: Build bootable ISO
        run: |
          make TARGET=i686-linux-gnu iso
          file build/ai-os.iso

      - name: Boot-test ISO with QEMU
        run: |
          timeout 8s qemu-system-i386 -cdrom build/ai-os.iso -display none -serial stdio -no-reboot -no-shutdown || test $? -eq 124

      - name: Generate checksums
        run: |
          sha256sum build/kernel.bin build/hello.com build/ai-os.iso > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Package validated outputs
        run: |
          tar -C build -czf ai-os-${GITHUB_SHA}.tar.gz kernel.bin hello.com ai-os.iso SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-os-${{ github.sha }}
          path: |
            ai-os-${{ github.sha }}.tar.gz
            build/ai-os.iso
            build/SHA256SUMS

      - name: Publish validated main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(git tag --list 'v0.1.*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="v0.1.0"
          else
            patch="${latest##*.}"
            version="v0.1.$((patch + 1))"
          fi
          gh release create "$version" "ai-os-${GITHUB_SHA}.tar.gz" build/ai-os.iso build/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "AI-OS $version" \
            --generate-notes

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "ai-os-${GITHUB_SHA}.tar.gz" build/ai-os.iso build/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "AI-OS ${GITHUB_REF_NAME}" \
            --generate-notes
