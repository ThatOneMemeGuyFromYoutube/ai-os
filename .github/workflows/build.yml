name: Build AI-OS

on:
  push:
    branches: ["main", "feature/lightweight-gui-shell"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  # Proactively exercise the upcoming GitHub Actions runtime migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cross compiler, GRUB, ISO tools, and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Validate TinyLang and build kernel
        run: |
          make TARGET=i686-linux-gnu check
          make TARGET=i686-linux-gnu
          file build/kernel.bin

      - name: Build bootable ISO
        run: |
          make TARGET=i686-linux-gnu iso
          file build/ai-os.iso

      - name: Boot-test ISO with repository target
        run: |
          make TARGET=i686-linux-gnu QEMU=qemu-system-i386 QEMU_TIMEOUT=8 check-iso

      - name: Generate checksums
        run: |
          sha256sum build/kernel.bin build/hello.com build/ai-os.iso > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Package validated outputs
        run: |
          tar -C build -czf ai-os-${GITHUB_SHA}.tar.gz kernel.bin hello.com ai-os.iso SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ai-os-${{ github.sha }}
          path: |
            ai-os-${{ github.sha }}.tar.gz
            build/ai-os.iso
            build/SHA256SUMS

      - name: Prepare release notes
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > build/RELEASE_NOTES.md <<'EOF'
          ## Validation

          - TinyLang regression tests passed.
          - 32-bit i386 cross-compiler, linker, and assembler checks passed.
          - Kernel and `.COM` program artifacts were generated and verified non-empty.
          - Bootable ISO was built and boot-tested via the repository's `make check-iso` target under `qemu-system-i386`.
          - GitHub Actions was forced through the Node 24 compatibility path with `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true`.
          - SHA-256 checksums are included in `SHA256SUMS`.
          EOF

      - name: Publish validated main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(git tag --list 'v0.1.*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="v0.1.0"
          else
            patch="${latest##*.}"
            version="v0.1.$((patch + 1))"
          fi
          gh release create "$version" "ai-os-${GITHUB_SHA}.tar.gz" build/ai-os.iso build/SHA256SUMS --target "$GITHUB_SHA" --title "AI-OS $version" --notes-file build/RELEASE_NOTES.md --generate-notes

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "ai-os-${GITHUB_SHA}.tar.gz" build/ai-os.iso build/SHA256SUMS --target "$GITHUB_SHA" --title "AI-OS ${GITHUB_REF_NAME}" --notes-file build/RELEASE_NOTES.md --generate-notes
